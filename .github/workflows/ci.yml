name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify pubspec.lock is up to date
        run: git diff --exit-code -- pubspec.lock

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test Android share pipeline
        run: ./android/gradlew -p android :app:testDebugUnitTest --no-daemon

      - name: Validate release shell syntax
        run: |
          bash -n scripts/validate-release.sh
          bash -n scripts/verify-release-artifacts.sh
          bash -n test/validate_release_test.sh
          bash -n test/verify_release_artifacts_test.sh
          bash -n test/validate_workflow_security.sh
          bash -n test/validate_release_ref_resolution.sh
          bash -n test/validate_all_workflow_pins.sh

      - name: Test release validation
        run: |
          bash test/validate_release_test.sh
          bash test/verify_release_artifacts_test.sh

      - name: Validate workflow security structure
        run: |
          bash test/validate_workflow_security.sh
          bash test/validate_release_ref_resolution.sh
          bash test/validate_all_workflow_pins.sh

      - name: Build debug APK
        run: flutter build apk --debug
