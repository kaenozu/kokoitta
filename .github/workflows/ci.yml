name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/46-release-artifact-verification-20260805
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply implementation
        shell: bash
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path

          release = Path('.github/workflows/release.yml')
          text = release.read_text(encoding='utf-8')
          marker = """      - name: Cleanup signing secrets
        if: always()
"""
          step = """      - name: Verify APK and AAB metadata
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          EXPECTED_APPLICATION_ID: com.kaenozu.kokoitta_app
        run: |
          scripts/verify-release-artifacts.sh \\
            --apk build/app/outputs/flutter-apk/app-release.apk \\
            --aab build/app/outputs/bundle/release/app-release.aab \\
            --version \"$EXPECTED_VERSION\" \\
            --version-code \"$EXPECTED_VERSION_CODE\" \\
            --application-id \"$EXPECTED_APPLICATION_ID\"

"""
          if text.count(marker) != 1:
              raise SystemExit(f'cleanup marker count={text.count(marker)}')
          text = text.replace(marker, step + marker, 1)
          release.write_text(text, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')
          needle = "          bash -n scripts/validate-release.sh\n"
          if text.count(needle) != 1:
              raise SystemExit(f'validate shell marker count={text.count(needle)}')
          text = text.replace(
              needle,
              needle + "          bash -n scripts/verify-release-artifacts.sh\n",
              1,
          )
          needle = "          bash -n test/validate_release_test.sh\n"
          if text.count(needle) != 1:
              raise SystemExit(f'test shell marker count={text.count(needle)}')
          text = text.replace(
              needle,
              needle + "          bash -n test/verify_release_artifacts_test.sh\n",
              1,
          )
          old = """      - name: Test release validation
        run: bash test/validate_release_test.sh
"""
          new = """      - name: Test release validation
        run: |
          bash test/validate_release_test.sh
          bash test/verify_release_artifacts_test.sh
"""
          if text.count(old) != 1:
              raise SystemExit(f'release test step count={text.count(old)}')
          text = text.replace(old, new, 1)
          ci.write_text(text, encoding='utf-8')

          staged = Path('.github/workflows/agent-46-apply.yml').read_text(encoding='utf-8')
          lines = staged.splitlines()
          name_index = lines.index('      - name: Apply implementation')
          run_index = next(i for i in range(name_index, len(lines)) if lines[i] == '        run: |')
          end_index = next(i for i in range(run_index + 1, len(lines)) if lines[i].startswith('      - name: Verify changes'))
          shell_lines = [line[10:] if line.startswith('          ') else line for line in lines[run_index + 1:end_index]]
          py_start = shell_lines.index("python3 - <<'PY'") + 1
          py_end = len(shell_lines) - 1 - shell_lines[::-1].index('PY')
          staged_code = '\n'.join(shell_lines[py_start:py_end])
          tail_start = staged_code.index("gradle = Path('android/build.gradle.kts')")
          exec(compile(staged_code[tail_start:], 'agent-46-tail', 'exec'), {'Path': Path, '__name__': '__main__'})
          Path('.github/workflows/agent-46-apply.yml').unlink(missing_ok=True)
          PY
          chmod +x scripts/verify-release-artifacts.sh test/verify_release_artifacts_test.sh

      - name: Verify changes
        shell: bash
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
          bash -n scripts/validate-release.sh
          bash -n scripts/verify-release-artifacts.sh
          bash -n test/validate_release_test.sh
          bash -n test/verify_release_artifacts_test.sh
          bash -n test/validate_workflow_security.sh
          bash -n test/validate_release_ref_resolution.sh
          bash test/validate_release_test.sh
          bash test/verify_release_artifacts_test.sh
          bash test/validate_workflow_security.sh
          bash test/validate_release_ref_resolution.sh
          flutter analyze
          flutter test
          ./android/gradlew -p android :app:testDebugUnitTest --no-daemon
          flutter build apk --debug
          git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'ChatGPT Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: verify release artifact metadata [agent-applied]'
          git push origin HEAD:agent/46-release-artifact-verification-20260805
