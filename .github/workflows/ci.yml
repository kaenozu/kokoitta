name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify pubspec.lock is up to date
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate release shell syntax
        run: |
          bash -n scripts/validate-release.sh
          bash -n test/validate_release_test.sh

      - name: Test release validation
        run: bash test/validate_release_test.sh

      - name: Validate workflow security structure
        run: bash test/validate_workflow_security.sh

      - name: Build debug APK
        run: flutter build apk --debug
