name: One-shot home compatibility fix

on:
  push:
    branches:
      - agent/85-home-map-redesign
    paths:
      - '.github/workflows/one-shot-fix-home-ci.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/85-home-map-redesign
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Apply compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          design = Path('lib/design/kokoitta_design_system.dart')
          text = design.read_text(encoding='utf-8')
          old = """extension KokoittaThemeContext on BuildContext {
            KokoittaSemanticColors get kokoittaColors {
              final colors = Theme.of(this).extension<KokoittaSemanticColors>();
              assert(colors != null, 'KokoittaSemanticColors is missing from ThemeData.');
              return colors!;
            }
          }
          """
          new = """extension KokoittaThemeContext on BuildContext {
            KokoittaSemanticColors get kokoittaColors {
              final theme = Theme.of(this);
              return theme.extension<KokoittaSemanticColors>() ??
                  KokoittaSemanticColors.fromScheme(theme.colorScheme);
            }
          }
          """
          if old not in text:
              raise SystemExit('semantic color getter pattern not found')
          design.write_text(text.replace(old, new, 1), encoding='utf-8')

          home = Path('lib/home_view.dart')
          text = home.read_text(encoding='utf-8')
          old_progress = """        title: cancelling ? '写真の追加をキャンセルしています' : '写真を追加しています',
                  message: cancelling
                      ? '保存前の処理を安全に取り消しています。完了するまでお待ちください。'
                      : '${event.processed} / ${event.total}枚を処理しています。',
          """
          new_progress = """        title: cancelling
                      ? '写真の追加をキャンセルしています'
                      : '取り込み ${event.processed} / ${event.total}',
                  message: cancelling
                      ? '保存前の処理を安全に取り消しています。完了するまでお待ちください。'
                      : '写真を安全に処理しています。',
          """
          if old_progress not in text:
              raise SystemExit('progress presentation pattern not found')
          text = text.replace(old_progress, new_progress, 1)

          old_map = """  Widget _mapView(BuildContext context) {
            return HomeMapDashboard(
              prefectureStates: _data.prefectureStates,
              prefectureSummary: _homePrefectureSummary,
              quota: HomeDashboardQuota(count: _photoCount, limit: _quotaStatus.limit),
              photoCount: _photoCount,
              recentTrips: _homeRecentTrips,
              operation: _homeOperation,
              addDisabledReason: _addDisabledReason,
              onAddPhotos: _cannotAddPhotos ? null : _addPhotos,
              onShowAllTrips: () => _updateState(() => _tab = 1),
              onShowPrefectureList: _isDisabled ? null : _showPrefectureList,
              onRestoreBackup: _isDisabled ? null : _showBackupMenu,
              onOpenSettings: null,
            );
          }
          """
          new_map = """  Widget _mapView(BuildContext context) {
            final operation = _homeOperation;
            return Column(
              children: <Widget>[
                if (operation != null)
                  Padding(
                    padding: const EdgeInsets.fromLTRB(
                      KokoittaSpacing.md,
                      KokoittaSpacing.sm,
                      KokoittaSpacing.md,
                      0,
                    ),
                    child: KokoittaStatePanel(
                      tone: KokoittaStateTone.progress,
                      title: operation.title,
                      message: operation.message,
                      progress: operation.progress,
                      busy: true,
                      liveRegion: true,
                      secondaryAction: operation.onCancel == null
                          ? null
                          : KokoittaActionButton(
                              label: 'キャンセル',
                              emphasis: KokoittaActionEmphasis.secondary,
                              onPressed: operation.onCancel,
                            ),
                    ),
                  ),
                Expanded(
                  child: HomeMapDashboard(
                    prefectureStates: _data.prefectureStates,
                    prefectureSummary: _homePrefectureSummary,
                    quota: HomeDashboardQuota(
                      count: _photoCount,
                      limit: _quotaStatus.limit,
                    ),
                    photoCount: _photoCount,
                    recentTrips: _homeRecentTrips,
                    addDisabledReason: _addDisabledReason,
                    onAddPhotos: _cannotAddPhotos ? null : _addPhotos,
                    onShowAllTrips: () => _updateState(() => _tab = 1),
                    onShowPrefectureList: _isDisabled
                        ? null
                        : _showPrefectureList,
                    onRestoreBackup: _isDisabled ? null : _showBackupMenu,
                    onOpenSettings: null,
                  ),
                ),
              ],
            );
          }
          """
          if old_map not in text:
              raise SystemExit('map view pattern not found')
          home.write_text(text.replace(old_map, new_map, 1), encoding='utf-8')
          PY
          rm .github/workflows/one-shot-fix-home-ci.yml
          dart format lib/design/kokoitta_design_system.dart lib/home_view.dart
      - name: Verify focused regressions
        run: |
          flutter pub get
          flutter analyze
          flutter test test/widget_test.dart test/import_cancellation_rollback_test.dart test/home_dashboard_test.dart
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/design/kokoitta_design_system.dart lib/home_view.dart .github/workflows/one-shot-fix-home-ci.yml
          git commit -m 'fix: keep home operations visible and theme-compatible'
          git push origin HEAD:agent/85-home-map-redesign
