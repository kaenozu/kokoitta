name: Home dashboard final patch

on:
  push:
    branches:
      - agent/85-home-map-redesign
    paths:
      - '.github/workflows/home-dashboard-diagnostic.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/85-home-map-redesign
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add generic disabled reason
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/home_view.dart')
          text = path.read_text(encoding='utf-8')
          old = """    if (!_pendingDeletionAvailable && _pendingDeletion != null) {
      return '削除処理の回復を確認しているため、写真を追加できません。';
    }
    return null;
"""
          new = """    if (!_pendingDeletionAvailable && _pendingDeletion != null) {
      return '削除処理の回復を確認しているため、写真を追加できません。';
    }
    if (_isDisabled) {
      return '処理が完了すると写真を追加できます。';
    }
    return null;
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one disabled-reason block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Format, test, and commit
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/home_view.dart
          flutter pub get
          flutter test test/home_dashboard_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/home-dashboard-diagnostic.yml
          git add lib/home_view.dart
          git commit -m 'fix: explain every disabled home photo action'
          git push origin HEAD:agent/85-home-map-redesign
