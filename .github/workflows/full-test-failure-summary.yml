name: Full Flutter test failure summary

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/full-test-failure-summary.yml'

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests and print only failures
        shell: bash
        run: |
          set +e
          flutter test --reporter json > /tmp/flutter-tests.jsonl 2>/tmp/flutter-tests.stderr
          status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path

          tests = {}
          errors = []
          failed = []
          for raw in Path('/tmp/flutter-tests.jsonl').read_text(encoding='utf-8').splitlines():
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              kind = event.get('type')
              if kind == 'testStart':
                  test = event.get('test', {})
                  tests[test.get('id')] = test.get('name')
              elif kind == 'error':
                  errors.append({
                      'test': tests.get(event.get('testID'), str(event.get('testID'))),
                      'error': event.get('error'),
                      'stack': event.get('stackTrace'),
                  })
              elif kind == 'testDone' and event.get('result') not in ('success', None):
                  failed.append({
                      'test': tests.get(event.get('testID'), str(event.get('testID'))),
                      'result': event.get('result'),
                      'hidden': event.get('hidden'),
                      'skipped': event.get('skipped'),
                  })
          print('FAILED_TESTS=' + json.dumps(failed, ensure_ascii=False, indent=2))
          print('ERRORS=' + json.dumps(errors, ensure_ascii=False, indent=2))
          stderr = Path('/tmp/flutter-tests.stderr').read_text(encoding='utf-8')
          if stderr.strip():
              print('STDERR_TAIL=')
              print('\n'.join(stderr.splitlines()[-120:]))
          PY
          exit "$status"
