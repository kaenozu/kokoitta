name: Refresh Flutter 3.47 lockfile once

on:
  push:
    branches:
      - fix/issue-133-builtin-kotlin
    paths:
      - .github/workflows/refresh-flutter-347-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issue-133-builtin-kotlin
          fetch-depth: 0

      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Generate canonical lockfile only
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          git checkout -- analysis_options.yaml || true
          git diff -- pubspec.lock
          git diff --exit-code -- . ':(exclude)pubspec.lock' ':(exclude).github/workflows/refresh-flutter-347-lock.yml'

      - name: Commit lockfile and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git rm .github/workflows/refresh-flutter-347-lock.yml
          git commit -m 'build: refresh lockfile for Flutter 3.47.1'
          git push origin HEAD:fix/issue-133-builtin-kotlin
