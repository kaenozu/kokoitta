# .github/workflows/release.yml
# リリースワークフロー - タグ起動 / 手動起動
# タグ vX.Y.Z の push、または workflow_dispatch で起動
# 関連: scripts/validate-release.sh, README.md

name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver: X.Y.Z, e.g. 1.2.3)'
        required: true
        type: string
      ref:
        description: 'Git ref to build from (branch, tag, or full SHA)'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || '' }}

      - name: Validate and resolve version
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Invalid version '$VERSION' (expected X.Y.Z, e.g. 1.2.3)"
              exit 1
            fi
            RELEASE_TAG="v$VERSION"
          else
            RELEASE_TAG="${{ github.ref_name }}"
            if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Invalid tag '$RELEASE_TAG' (expected vX.Y.Z, e.g. v1.2.3)"
              exit 1
            fi
            VERSION="${RELEASE_TAG#v}"
          fi

          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          VERSION_CODE="${{ github.run_number }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.resolve.outputs.release_tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "::error::Release with tag '$TAG' already exists. Use a different version."
            echo "::error::If re-running a failed workflow, delete the existing release first."
            exit 1
          fi

      - name: Log resolved release info
        run: |
          echo "============================================"
          echo "  Event:            ${{ github.event_name }}"
          echo "  Release tag:      ${{ steps.resolve.outputs.release_tag }}"
          echo "  Version name:     ${{ steps.resolve.outputs.version }}"
          echo "  Version code:     ${{ steps.resolve.outputs.version_code }}"
          echo "  Commit SHA:       ${{ steps.resolve.outputs.commit_sha }}"
          echo "============================================"

  release:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout at resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Log release info
        run: |
          echo "============================================"
          echo "  Release tag:      ${{ needs.validate.outputs.release_tag }}"
          echo "  Version name:     ${{ needs.validate.outputs.version }}"
          echo "  Version code:     ${{ needs.validate.outputs.version_code }}"
          echo "  Commit SHA:       ${{ needs.validate.outputs.commit_sha }}"
          echo "============================================"

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<PROPERTIES
          storeFile=release-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - name: Build signed APK
        run: |
          flutter build apk --release \
            --build-name="${{ needs.validate.outputs.version }}" \
            --build-number="${{ needs.validate.outputs.version_code }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "kokoitta_app-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.short_sha }}.apk"

      - name: Build signed AAB
        run: |
          flutter build appbundle --release \
            --build-name="${{ needs.validate.outputs.version }}" \
            --build-number="${{ needs.validate.outputs.version_code }}"
          cp build/app/outputs/bundle/release/app-release.aab \
            "kokoitta_app-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.short_sha }}.aab"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          name: ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: |
            kokoitta_app-*.apk
            kokoitta_app-*.aab
