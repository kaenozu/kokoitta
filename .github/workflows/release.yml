# .github/workflows/release.yml
# リリースワークフロー - タグ起動 / 手動起動
# タグ vX.Y.Z の push、または workflow_dispatch で起動
# 関連: scripts/validate-release.sh, scripts/verify-release-artifacts.sh, README.md

name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver: X.Y.Z, e.g. 1.2.3)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Reject non-main manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          echo "::error::Manual releases must run from main (got $WORKFLOW_REF)."
          exit 1

      - name: Checkout event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07  # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Verify event commit belongs to main
        env:
          EVENT_COMMIT_SHA: ${{ github.sha }}
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$EVENT_COMMIT_SHA" origin/main; then
            echo "::error::Release commit must be contained in main."
            exit 1
          fi

      - name: Validate and resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          COMMIT_SHA="$EVENT_COMMIT_SHA"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          VERSION_CODE="$RUN_NUMBER"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            scripts/validate-release.sh \
              --version "$INPUT_VERSION" \
              --version-code "$VERSION_CODE" \
              >> "$GITHUB_OUTPUT"
          else
            scripts/validate-release.sh \
              --tag "$INPUT_TAG_NAME" \
              --version-code "$VERSION_CODE" \
              >> "$GITHUB_OUTPUT"
          fi

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.resolve.outputs.release_tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "::error::Release with tag '$TAG' already exists. Use a different version."
            exit 1
          fi

      - name: Check for existing tag
        run: |
          TAG="${{ steps.resolve.outputs.release_tag }}"
          COMMIT_SHA="${{ steps.resolve.outputs.commit_sha }}"
          git fetch --force --tags
          if git rev-parse "refs/tags/$TAG^{}" &>/dev/null; then
            TAG_SHA="$(git rev-parse "refs/tags/$TAG^{}")"
            if [[ "$TAG_SHA" != "$COMMIT_SHA" ]]; then
              echo "::error::Tag '$TAG' already exists but points to a different commit ($TAG_SHA vs $COMMIT_SHA)"
              exit 1
            fi
            echo "Tag '$TAG' already exists and points to the same commit ($COMMIT_SHA). Proceeding."
          fi

      - name: Log resolved release info
        run: |
          echo "============================================"
          echo "  Event:            ${{ github.event_name }}"
          echo "  Release tag:      ${{ steps.resolve.outputs.release_tag }}"
          echo "  Version name:     ${{ steps.resolve.outputs.version }}"
          echo "  Version code:     ${{ steps.resolve.outputs.version_code }}"
          echo "  Commit SHA:       ${{ steps.resolve.outputs.commit_sha }}"
          echo "============================================"

  release:
    needs: [validate]
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    steps:
      - name: Checkout at resolved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07  # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Log release info
        run: |
          echo "============================================"
          echo "  Release tag:      ${{ needs.validate.outputs.release_tag }}"
          echo "  Version name:     ${{ needs.validate.outputs.version }}"
          echo "  Version code:     ${{ needs.validate.outputs.version_code }}"
          echo "  Commit SHA:       ${{ needs.validate.outputs.commit_sha }}"
          flutter --version
          java -version
          echo "============================================"

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<PROPERTIES
          storeFile=release-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - name: Build signed APK
        run: |
          flutter build apk --release \
            --build-name="${{ needs.validate.outputs.version }}" \
            --build-number="${{ needs.validate.outputs.version_code }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "kokoitta_app-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.short_sha }}.apk"

      - name: Build signed AAB
        run: |
          flutter build appbundle --release \
            --build-name="${{ needs.validate.outputs.version }}" \
            --build-number="${{ needs.validate.outputs.version_code }}"
          cp build/app/outputs/bundle/release/app-release.aab \
            "kokoitta_app-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.short_sha }}.aab"

      - name: Verify APK and AAB metadata
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          EXPECTED_APPLICATION_ID: com.kaenozu.kokoitta_app
        run: |
          bash scripts/verify-release-artifacts.sh \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --version "$EXPECTED_VERSION" \
            --version-code "$EXPECTED_VERSION_CODE" \
            --application-id "$EXPECTED_APPLICATION_ID"

      - name: Cleanup signing secrets
        if: always()
        run: |
          rm -f android/app/release-keystore.jks
          rm -f android/key.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          name: ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ needs.validate.outputs.commit_sha }}
          files: |
            kokoitta_app-*.apk
            kokoitta_app-*.aab
