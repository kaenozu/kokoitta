name: Repair issue 134 missing-photo privacy

on:
  push:
    branches: [fix/missing-photo-path-privacy-134]
    paths:
      - .github/workflows/repair-issue134-privacy.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/missing-photo-path-privacy-134
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply privacy repair
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/home_data.dart')
          text = path.read_text(encoding='utf-8')
          old = """          '破棄すると、この写真の記録（${missing.path}）が保存データから削除されます。'\n          '元の写真ファイルが端末にある場合は、先に「選び直す」で再登録できます。',"""
          new = """          '破棄すると、この写真の記録が保存データから削除されます。'\n          '元の写真ファイルが端末にある場合は、先に「選び直す」で再登録できます。',"""
          if old not in text:
              raise SystemExit('discard dialog path interpolation not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('test/missing_photo_privacy_contract_test.dart')
          test.write_text("""import 'dart:io';\n\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('missing photo discard confirmation never renders the private path', () {\n    final source = File('lib/home_data.dart').readAsStringSync();\n    final start = source.indexOf('Future<bool?> _confirmDiscard');\n    final end = source.indexOf('Future<_CopiedImportResult> _copyPickedImages', start);\n\n    expect(start, greaterThanOrEqualTo(0));\n    expect(end, greaterThan(start));\n    final dialogSource = source.substring(start, end);\n    expect(dialogSource, isNot(contains('missing.path')));\n    expect(dialogSource, contains('この写真の記録が保存データから削除されます'));\n  });\n}\n""", encoding='utf-8')
      - name: Validate
        run: |
          flutter pub get
          dart format lib/home_data.dart test/missing_photo_privacy_contract_test.dart
          git diff --check
          flutter analyze
          flutter test test/missing_photo_privacy_contract_test.dart
          flutter test
      - name: Commit repair
        run: |
          rm .github/workflows/repair-issue134-privacy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/home_data.dart test/missing_photo_privacy_contract_test.dart .github/workflows/repair-issue134-privacy.yml
          git diff --cached --check
          git commit -m 'fix: hide private path from missing-photo dialog'
          git push origin HEAD:fix/missing-photo-path-privacy-134
