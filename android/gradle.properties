org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47 supports AGP 9 built-in Kotlin, but its Gradle plugin still
# depends on legacy AGP DSL types. Keep only the new DSL compatibility opt-out
# until Flutter 3.50/newDsl migration support is available.
android.newDsl=false
