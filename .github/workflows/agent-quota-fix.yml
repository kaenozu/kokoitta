name: Agent quota action-scope fix

on:
  pull_request:
  push:
    branches:
      - agent/60-quota-action-scope-20260805

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/60-quota-action-scope-20260805
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Apply focused source change
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path('lib/home_view.dart')
          source = path.read_text(encoding='utf-8')

          source, count = re.subn(
              r"  bool get _isDisabled =>\n\s+_isLoading \|\| "
              r"_coordinator\.isBusy \|\| _isImportBusy \|\| _photoQuotaReached;",
              "  bool get _isDisabled =>\n"
              "      _isLoading || _coordinator.isBusy || _isImportBusy;\n\n"
              "  bool get _cannotAddPhotos =>\n"
              "      _isDisabled || _loadError != null || _photoQuotaReached;",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Unexpected _isDisabled source shape')

          source, count = re.subn(
              r"onPressed: _isDisabled \|\| _loadError != null \|\| "
              r"_photoQuotaReached\s*\? null\s*: _addPhotos,",
              "onPressed: _cannotAddPhotos ? null : _addPhotos,",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Unexpected app-bar photo action shape')

          photo_action = 'onPressed: _isDisabled ? null : _addPhotos,'
          if source.count(photo_action) != 3:
              raise SystemExit(
                  f'Expected 3 direct photo actions, found {source.count(photo_action)}'
              )
          source = source.replace(
              photo_action,
              'onPressed: _cannotAddPhotos ? null : _addPhotos,',
          )

          source, count = re.subn(
              r"onPressed: _isDisabled\s*\? null\s*: \(\) \{\s*"
              r"Navigator\.pop\(sheetContext\);\s*"
              r"_addPhotos\(tripId: trip\.id\);\s*\},",
              "onPressed: _cannotAddPhotos\n"
              "                    ? null\n"
              "                    : () {\n"
              "                        Navigator.pop(sheetContext);\n"
              "                        _addPhotos(tripId: trip.id);\n"
              "                      },",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Unexpected trip photo action shape')

          path.write_text(source, encoding='utf-8')

          test = Path('test/quota_action_scope_test.dart')
          test.write_text('''import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('photo quota only disables photo-add actions', () {
              final source = File('lib/home_view.dart').readAsStringSync();

              expect(
                RegExp(
                  r'bool get _isDisabled =>\\s*_isLoading \\|\\| '
                  r'_coordinator\\.isBusy \\|\\| _isImportBusy;',
                ).hasMatch(source),
                isTrue,
              );
              expect(
                RegExp(
                  r'bool get _cannotAddPhotos =>\\s*_isDisabled \\|\\| '
                  r'_loadError != null \\|\\| _photoQuotaReached;',
                ).hasMatch(source),
                isTrue,
              );
              expect(
                source.contains('onPressed: _isDisabled ? null : _showBackupMenu'),
                isTrue,
              );
              expect(source.contains('enabled: !_isDisabled'), isTrue);
              expect(
                source.contains('onPressed: _cannotAddPhotos ? null : _addPhotos'),
                isTrue,
              );
            });
          }
          ''', encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/home_view.dart test/quota_action_scope_test.dart
          flutter analyze
          flutter test test/quota_action_scope_test.dart
          flutter test
          flutter build apk --debug
          git diff --check
      - name: Commit focused change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/home_view.dart test/quota_action_scope_test.dart
          git commit -m 'fix: keep recovery actions available at photo quota'
          git push origin HEAD:agent/60-quota-action-scope-20260805
