name: Repair issue 131 release gate

on:
  push:
    branches: [fix/release-android-ci-gate-131]
    paths:
      - .github/workflows/repair-issue131-release-gate.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/release-android-ci-gate-131
      - name: Apply release gate repair
        shell: python
        run: |
          from pathlib import Path

          release = Path('.github/workflows/release.yml')
          text = release.read_text(encoding='utf-8')
          old = '''permissions:\n  contents: read\n'''
          new = '''permissions:\n  contents: read\n  actions: read\n'''
          if old not in text:
              raise SystemExit('workflow permissions block not found')
          text = text.replace(old, new, 1)

          marker = '''      - name: Validate and resolve version\n'''
          guard = '''      - name: Require successful CI for release commit\n        env:\n          GH_TOKEN: ${{ github.token }}\n          RELEASE_COMMIT_SHA: ${{ github.sha }}\n          REPOSITORY: ${{ github.repository }}\n        run: |\n          SUCCESS_COUNT="$(\n            gh api \\\n              -H 'X-GitHub-Api-Version: 2022-11-28' \\\n              "/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_COMMIT_SHA&status=success&per_page=100" \\\n              --jq '.workflow_runs | length'\n          )"\n          if [[ "$SUCCESS_COUNT" -lt 1 ]]; then\n            echo "::error::Release commit $RELEASE_COMMIT_SHA has no successful CI workflow run."\n            exit 1\n          fi\n          echo "Verified successful CI for release commit $RELEASE_COMMIT_SHA."\n\n'''
          if marker not in text:
              raise SystemExit('version validation step not found')
          text = text.replace(marker, guard + marker, 1)

          old = '''      - name: Test\n        run: flutter test\n\n      - name: Log release info\n'''
          new = '''      - name: Test\n        run: flutter test\n\n      - name: Test Android unit suite\n        run: ./android/gradlew -p android :app:testDebugUnitTest --no-daemon\n\n      - name: Log release info\n'''
          if old not in text:
              raise SystemExit('release Flutter test step not found')
          release.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('test/validate_workflow_security.sh')
          body = test.read_text(encoding='utf-8')
          permission_assert = '''assert_section_contains "$workflow_permissions" "contents: read" \\\n  "workflow defaults to contents: read"\n'''
          permission_new = permission_assert + '''assert_section_contains "$workflow_permissions" "actions: read" \\\n  "workflow grants read-only Actions access for exact-commit CI verification"\n'''
          if permission_assert not in body:
              raise SystemExit('workflow permission assertion not found')
          body = body.replace(permission_assert, permission_new, 1)

          ancestry_assert = '''assert_section_contains "$validate_section" "Reject non-main manual runs" \\\n  "manual runs fail closed outside main"\n'''
          gate_asserts = ancestry_assert + '''assert_section_contains "$validate_section" "Require successful CI for release commit" \\\n  "release validation requires exact-commit CI success"\nassert_section_contains "$validate_section" \\\n  '/actions/workflows/ci.yml/runs?head_sha=$RELEASE_COMMIT_SHA&status=success' \\\n  "release validation queries CI by exact commit SHA"\n'''
          if ancestry_assert not in body:
              raise SystemExit('manual run assertion not found')
          body = body.replace(ancestry_assert, gate_asserts, 1)

          release_ref_assert = '''assert_section_contains "$release_section" \\\n  'target_commitish: ${{ needs.validate.outputs.commit_sha }}' \\\n  "Release tag targets the validated commit"\n'''
          android_assert = release_ref_assert + '''assert_section_contains "$release_section" \\\n  './android/gradlew -p android :app:testDebugUnitTest --no-daemon' \\\n  "release job runs Android unit tests before signing and publication"\n'''
          if release_ref_assert not in body:
              raise SystemExit('release target assertion not found')
          test.write_text(body.replace(release_ref_assert, android_assert, 1), encoding='utf-8')
      - name: Validate workflow contract only
        run: |
          bash -n test/validate_workflow_security.sh
          bash test/validate_workflow_security.sh
          bash test/validate_release_ref_resolution.sh
          git diff --check
      - name: Commit repair
        run: |
          rm .github/workflows/repair-issue131-release-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml test/validate_workflow_security.sh .github/workflows/repair-issue131-release-gate.yml
          git diff --cached --check
          git commit -m 'ci: require exact-commit Android release gates'
          git push origin HEAD:fix/release-android-ci-gate-131
