name: One-shot update home regression tests

on:
  pull_request:
    branches:
      - agent/84-design-system
    paths:
      - '.github/workflows/one-shot-update-home-regression-tests.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/85-home-map-redesign
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Update regression contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          widget = Path('test/widget_test.dart')
          text = widget.read_text(encoding='utf-8')
          text, count = re.subn(
              r"final addPhotoButton = find\.ancestor\(\s*"
              r"of: find\.byTooltip\('写真を追加'\)\.first,\s*"
              r"matching: find\.byType\(IconButton\),\s*\);\s*"
              r"expect\(tester\.widget<IconButton>\(addPhotoButton\)\.onPressed, isNull\);",
              """final addPhotoButton = find.widgetWithText(
                FilledButton,
                '写真を追加',
              );
              expect(tester.widget<FilledButton>(addPhotoButton).onPressed, isNull);""",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'disabled CTA replacements={count}')
          text, count = re.subn(
              r"final reenabledAddPhotoButton = find\.ancestor\(\s*"
              r"of: find\.byTooltip\('写真を追加'\)\.first,\s*"
              r"matching: find\.byType\(IconButton\),\s*\);\s*"
              r"expect\(\s*tester\.widget<IconButton>\(reenabledAddPhotoButton\)\.onPressed,\s*"
              r"isNotNull,\s*\);",
              """final reenabledAddPhotoButton = find.widgetWithText(
                FilledButton,
                '写真を追加',
              );
              expect(
                tester.widget<FilledButton>(reenabledAddPhotoButton).onPressed,
                isNotNull,
              );""",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'reenabled CTA replacements={count}')
          widget.write_text(text, encoding='utf-8')

          dashboard = Path('test/home_dashboard_test.dart')
          text = dashboard.read_text(encoding='utf-8')
          text, count = re.subn(
              r"builder: \(context\) => ColoredBox\(\s*"
              r"color: context\.kokoittaColors\.successContainer,",
              """builder: (context) => ColoredBox(
                key: const ValueKey<String>('semantic-color-fallback'),
                color: context.kokoittaColors.successContainer,""",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'semantic fixture replacements={count}')
          text, count = re.subn(
              r"expect\(find\.byType\(ColoredBox\), findsOneWidget\);",
              "expect(find.byKey(const ValueKey<String>('semantic-color-fallback')), findsOneWidget);",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'semantic finder replacements={count}')
          dashboard.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/one-shot-update-home-regression-tests.yml
          dart format test/widget_test.dart test/home_dashboard_test.dart
          git diff --check
      - name: Commit regression updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align home regressions with the single primary CTA'
          git push origin HEAD:agent/85-home-map-redesign
